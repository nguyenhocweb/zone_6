services:
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: zone6-backend
    restart: always
    env_file:
      - ./be/.env
    environment:
      - PORT=8000
      - NODE_ENV=production
    volumes:
      # Giữ lại phiên đăng nhập Zalo Bot khi container khởi động lại
      - zalo_sessions:/app/.sessions
    networks:
      - zone6-network
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: zone6-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - zone6-network

volumes:
  zalo_sessions:

networks:
  zone6-network:
    driver: bridge
