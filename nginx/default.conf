# Bản đồ nâng cấp kết nối HTTP -> WebSocket tiêu chuẩn Nginx
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Nén Gzip tối ưu tốc độ truyền tải
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cấu hình chuyên biệt cho WebSocket Socket.io (POS Real-time & Zalo Bot)
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Tắt bộ đệm để các gói tin giỏ hàng real-time được đẩy tức thì
        proxy_buffering off;

        # Nâng cấp kết nối WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối WebSocket bền bỉ (24h) không bị ngắt timeout khi ca trực đang chạy
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # Chuyển tiếp toàn bộ API RESTful về container backend
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Hỗ trợ WebSocket dự phòng
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Thời gian chờ phản hồi tối đa cho HTTP request thông thường
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
